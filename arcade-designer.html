<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blockcade Designer</title><style>body{margin:0;background:#0f172a;color:#e5e7eb;font-family:Arial,sans-serif}main{max-width:1100px;margin:auto;padding:22px}a{color:#93c5fd}button,input,textarea{font:inherit}button{border:0;border-radius:10px;background:#1f2937;color:#fff;padding:9px 12px;margin:4px;cursor:pointer}.on,.primary{background:#2563eb}input,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #334155;background:#020617;color:#fff;margin:5px 0 10px}.layout{display:grid;grid-template-columns:1fr 290px;gap:18px}.grid{display:grid;grid-template-columns:repeat(20,30px);grid-template-rows:repeat(12,30px);gap:2px;overflow:auto;background:#020617;border:1px solid #334155;border-radius:14px;padding:5px}.t{width:30px;height:30px;border-radius:5px;display:grid;place-items:center;font-weight:bold;user-select:none}.e{background:#e0f2fe;color:#111827}.w{background:#334155}.s{background:#3b82f6}.g{background:#22c55e}.c{background:#facc15;color:#111827}.x{background:#ef4444}.l{background:#f97316}.p{outline:3px solid white}.card{background:#111827;border:1px solid #334155;border-radius:16px;padding:14px;margin:12px 0}.status{color:#9ca3af}.ok{color:#34d399}.bad{color:#fb7185}@media(max-width:850px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(20,24px);grid-template-rows:repeat(12,24px)}.t{width:24px;height:24px}}</style></head><body><main><p><a href="index.html">Back</a> · <a href="arcade.html">Classic Arcade</a></p><h1>🎮 Advanced Blockcade Designer</h1><p class="status">Local advanced editor: brush, fill, rectangle, undo/redo, mirror, path check, export/import, and test play. Use this to design maps, then copy the exported code into future arcade upgrades.</p><section class="layout"><div class="card"><input id="title" value="Advanced Map"><div><button class="tool on" data-tool="brush">Brush</button><button class="tool" data-tool="fill">Fill</button><button class="tool" data-tool="rect">Rectangle</button><button class="tool" data-tool="pick">Picker</button></div><div id="grid" class="grid"></div><div><button id="test" class="primary">Test</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="mirror">Mirror</button><button id="demo">Demo</button><button id="blank">Blank</button><button id="check">Check Path</button></div><textarea id="code" placeholder="Export/import code"></textarea><button id="export">Export</button><button id="importBtn">Import</button><p id="msg" class="status"></p></div><aside class="card"><h2>Tiles</h2><div id="pal"></div><p id="stats" class="status"></p><h2>Play</h2><p class="status">WASD or arrow keys.</p><div id="play" class="grid"></div><p id="hud" class="status"></p></aside></section></main><script>const W=20,H=12,N=240,A=['e','w','s','g','c','x','l'],SYM=['','', 'S','★','●','▲','~'];let map=Array(N).fill(0),paint=1,tool='brush',hist=[],fut=[],rect=null,player=-1,playMap=null,coins=0,deaths=0;const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));function ix(x,y){return y*W+x}function xy(i){return[i%W,Math.floor(i/W)]}function save(){hist.push(map.join(''));if(hist.length>50)hist.shift();fut=[]}function cell(v,i,playing){let d=document.createElement('div');d.className='t '+A[v]+(playing&&i===player?' p':'');d.textContent=playing&&i===player?'🙂':SYM[v];return d}function draw(){let g=$('#grid');g.innerHTML='';map.forEach((v,i)=>{let d=cell(v,i,false);d.onpointerdown=()=>use(i);d.onpointerenter=e=>{if(e.buttons&&tool==='brush')put(i,false)};g.append(d)});stats()}function stats(){let s=map.filter(x=>x===2).length,g=map.filter(x=>x===3).length,c=map.filter(x=>x===4).length,b=map.filter(x=>x>4).length;$('#stats').textContent=`Start ${s} • Goal ${g} • Coins ${c} • Danger ${b}`}function put(i,h=true){if(h)save();if(paint===2)map=map.map(x=>x===2?0:x);map[i]=paint;draw()}function fill(i){save();let old=map[i];if(old===paint)return;let q=[i],seen=new Set([i]);while(q.length){let n=q.shift();map[n]=paint;let[x,y]=xy(n);[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{let nx=x+dx,ny=y+dy,j=ix(nx,ny);if(nx>=0&&nx<W&&ny>=0&&ny<H&&!seen.has(j)&&map[j]===old){seen.add(j);q.push(j)}})}draw()}function rectPaint(i){if(rect===null){rect=i;$('#msg').textContent='Pick second rectangle corner.';return}save();let[x1,y1]=xy(rect),[x2,y2]=xy(i);for(let y=Math.min(y1,y2);y<=Math.max(y1,y2);y++)for(let x=Math.min(x1,x2);x<=Math.max(x1,x2);x++)map[ix(x,y)]=paint;rect=null;draw()}function use(i){if(tool==='pick'){paint=map[i];pal();return}if(tool==='fill')return fill(i);if(tool==='rect')return rectPaint(i);put(i)}function pal(){let p=$('#pal');p.innerHTML='';['Floor','Wall','Start','Goal','Coin','Spike','Lava'].forEach((name,i)=>{let b=document.createElement('button');b.className=i===paint?'on':'';b.textContent=(SYM[i]||'□')+' '+name;b.onclick=()=>{paint=i;pal()};p.append(b)})}function path(){let st=map.indexOf(2),goals=new Set(map.map((v,i)=>v===3?i:-1).filter(i=>i>=0));if(st<0||!goals.size)return false;let q=[st],seen=new Set([st]);while(q.length){let n=q.shift();if(goals.has(n))return true;let[x,y]=xy(n);[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{let nx=x+dx,ny=y+dy,j=ix(nx,ny);if(nx>=0&&nx<W&&ny>=0&&ny<H&&!seen.has(j)&&![1,5,6].includes(map[j])){seen.add(j);q.push(j)}})}return false}function demo(){save();map=Array(N).fill(0);for(let x=0;x<W;x++)map[ix(x,H-1)]=1;for(let x=4;x<8;x++)map[ix(x,8)]=1;for(let x=11;x<15;x++)map[ix(x,6)]=1;map[ix(1,10)]=2;map[ix(18,5)]=3;[ix(5,7),ix(12,5),ix(15,10)].forEach(i=>map[i]=4);map[ix(9,10)]=5;map[ix(13,10)]=6;draw()}function drawPlay(){let g=$('#play');g.innerHTML='';if(!playMap)return;playMap.forEach((v,i)=>g.append(cell(v,i,true)));$('#hud').textContent=`Coins ${coins} • Deaths ${deaths}`}function start(){if(map.filter(x=>x===2).length!==1)return msg('Need exactly one Start.',0);if(!map.some(x=>x===3))return msg('Need a Goal.',0);playMap=map.slice();player=playMap.indexOf(2);coins=0;deaths=0;drawPlay();msg('Test started.',1)}function move(dx,dy){if(!playMap)return;let x=player%W,y=Math.floor(player/W),nx=x+dx,ny=y+dy;if(nx<0||nx>=W||ny<0||ny>=H)return;let j=ix(nx,ny),v=playMap[j];if(v===1)return;if(v===5||v===6){deaths++;player=playMap.indexOf(2);drawPlay();return}if(v===4){coins++;playMap[j]=0}player=j;if(v===3)msg('You win!',1);drawPlay()}function msg(t,good){$('#msg').textContent=t;$('#msg').className='status '+(good?'ok':'bad')}$$('.tool').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;rect=null;$$('.tool').forEach(x=>x.classList.toggle('on',x===b))});$('#test').onclick=start;$('#undo').onclick=()=>{if(hist.length){fut.push(map.join(''));map=hist.pop().split('').map(Number);draw()}};$('#redo').onclick=()=>{if(fut.length){hist.push(map.join(''));map=fut.pop().split('').map(Number);draw()}};$('#mirror').onclick=()=>{save();let n=Array(N).fill(0);for(let y=0;y<H;y++)for(let x=0;x<W;x++)n[ix(W-1-x,y)]=map[ix(x,y)];map=n;draw()};$('#demo').onclick=demo;$('#blank').onclick=()=>{save();map=Array(N).fill(0);draw()};$('#check').onclick=()=>msg(path()?'Valid path found.':'No safe path.',path());$('#export').onclick=()=>$('#code').value=JSON.stringify({title:$('#title').value,map:map.join('')});$('#importBtn').onclick=()=>{try{let o=JSON.parse($('#code').value);save();map=String(o.map||'').split('').map(Number).slice(0,N);while(map.length<N)map.push(0);draw();msg('Imported.',1)}catch{msg('Import failed.',0)}};window.onkeydown=e=>{let k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')move(-1,0);if(k==='arrowright'||k==='d')move(1,0);if(k==='arrowup'||k==='w')move(0,-1);if(k==='arrowdown'||k==='s')move(0,1)};pal();demo();</script></body></html>
