<body>

<div class="app">

  <style>
    @media (max-width: 900px) {
      .app {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid rgba(59,130,246,0.2);
        display: flex;
        gap: 15px;
        align-items: center;
        padding: 12px 20px;
      }
      .logo { margin-bottom: 0; font-size: 24px; }
      .new-chat { margin-bottom: 0; width: auto; padding: 10px 16px; }
      .mode-bar { margin-bottom: 0; display: flex; align-items: center; gap: 8px; }
      .mode-bar label { display: none; } /* Hide label on mobile to save space */
      .mode-bar select { padding: 8px; }
    }
    
    /* Style for basic markdown rendering */
    .message code {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', Courier, monospace;
    }
  </style>

  <div class="sidebar">
    <div class="logo">Kigazine <span>Ai</span></div>
    <button class="new-chat" onclick="newChat()">+ New Chat</button>
    <div class="mode-bar">
      <label>Choose Mode</label>
      <select id="mode">
        <option value="friendly">Friendly 😊</option>
        <option value="normal" selected>Normal ⚡</option>
        <option value="work">Work 💼</option>
        <option value="coding">Coding 💻</option>
        <option value="school">School 📚</option>
        <option value="creative">Creative 🎨</option>
        <option value="kids">Kids 🧸</option>
      </select>
    </div>
  </div>

  <div class="chat-area">
    <div class="chat-header">Kigazine Ai</div>
    <div id="chat"></div>

    <div class="input-area">
      <input type="text" id="input" placeholder="Ask Kigazine Ai anything..." autocomplete="off" />
      <button id="send">Send</button>
    </div>
    <div class="footer">Powered by OpenAI</div>
  </div>

</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
const mode = document.getElementById("mode");

function makeSessionId() {
  return `session-${Date.now()}-${Math.random().toString(36).slice(2)}`;
}

let sessionId = localStorage.getItem("sessionId");
if (!sessionId || typeof sessionId !== "string") {
  sessionId = makeSessionId();
  localStorage.setItem("sessionId", sessionId);
}

// Simple internal formatter to handle basic markdown (**bold** and `code`) safely
function formatMarkdown(text) {
  let escaped = text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
  
  // Convert **bold** to <strong>
  escaped = escaped.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
  // Convert `code` to <code>
  escaped = escaped.replace(/`(.*?)`/g, "<code>$1</code>");
  
  return escaped;
}

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = `message ${type}`;
  
  if (type === 'bot' && text !== "Kigazine Ai is typing...") {
    div.innerHTML = formatMarkdown(text);
  } else {
    div.textContent = text;
  }

  chat.appendChild(div);
  requestAnimationFrame(() => {
    chat.scrollTop = chat.scrollHeight;
  });
}

async function newChat() {
  try {
    await fetch("/api/reset", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId })
    });
  } catch (error) {
    console.warn("Reset failed:", error);
  }
  localStorage.removeItem("sessionId");
  location.reload();
}

async function sendMessage() {
  if (send.disabled) return;

  const message = input.value.trim();
  if (!message) return;

  addMessage(message, "user");
  input.value = "";
  
  // UI Lock down during processing
  send.disabled = true;
  input.disabled = true; 

  const typing = document.createElement("div");
  typing.className = "message bot";
  typing.id = "typing";
  typing.textContent = "Kigazine Ai is typing...";
  chat.appendChild(typing);
  
  requestAnimationFrame(() => {
    chat.scrollTop = chat.scrollHeight;
  });

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message,
        sessionId,
        mode: mode.value
      })
    });

    document.getElementById("typing")?.remove();

    let data = {};
    try {
      data = await response.json();
    } catch (error) {
      throw new Error("The server did not return valid JSON.");
    }

    if (!response.ok) {
      throw new Error(data.error || "Kigazine Ai backend error.");
    }

    if (data.sessionId) {
      sessionId = data.sessionId;
      localStorage.setItem("sessionId", sessionId);
    }

    addMessage(data.reply || "Kigazine Ai did not send a reply.", "bot");

  } catch (error) {
    document.getElementById("typing")?.remove();
    addMessage(error.message || "Error communicating with Kigazine Ai.", "bot");
  } finally {
    // Always unlock UI elements when done
    send.disabled = false;
    input.disabled = false;
    input.focus();
  }
}

send.addEventListener("click", sendMessage);
input.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    sendMessage();
  }
});
</script>
</body>
