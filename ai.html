<!-- public/index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Kigazine Ai</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        linear-gradient(
          to bottom right,
          #020617,
          #0f172a,
          #111827
        );
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      display: flex;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .sidebar {
      width: 260px;
      background: rgba(2, 6, 23, 0.95);
      border-right: 1px solid rgba(59,130,246,0.2);
      padding: 20px;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .logo span {
      color: #38bdf8;
    }

    .back-button {
      width: 100%;
      padding: 14px;
      border: 1px solid rgba(59,130,246,0.35);
      border-radius: 12px;
      background: rgba(15,23,42,0.95);
      color: #bfdbfe;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .back-button:hover {
      background: rgba(30,41,59,0.95);
      box-shadow: 0 0 10px rgba(56,189,248,0.2);
    }

    .new-chat {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background:
        linear-gradient(
          135deg,
          #2563eb,
          #38bdf8
        );
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .mode-bar {
      margin-bottom: 20px;
    }

    .mode-bar label {
      display: block;
      margin-bottom: 8px;
      color: #93c5fd;
    }

    .mode-bar select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(59,130,246,0.3);
      background: rgba(15,23,42,0.9);
      color: white;
      outline: none;
    }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      min-width: 0;
    }

    .top-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .mobile-back-button {
      display: none;
      padding: 10px 14px;
      border: 1px solid rgba(59,130,246,0.35);
      border-radius: 10px;
      background: rgba(15,23,42,0.95);
      color: #bfdbfe;
      cursor: pointer;
      font-weight: bold;
    }

    .chat-header {
      font-size: 34px;
      font-weight: bold;
      text-shadow: 0 0 10px #38bdf8;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding-right: 10px;
    }

    .message {
      max-width: 75%;
      padding: 14px 18px;
      margin-bottom: 14px;
      border-radius: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      animation: fadeIn 0.2s ease;
    }

    .user {
      margin-left: auto;
      background:
        linear-gradient(
          135deg,
          #2563eb,
          #38bdf8
        );
      box-shadow: 0 0 15px rgba(56,189,248,0.2);
    }

    .bot {
      background: rgba(30,41,59,0.95);
      border: 1px solid rgba(96,165,250,0.2);
    }

    .system {
      margin-left: auto;
      margin-right: auto;
      max-width: 90%;
      background: rgba(15,23,42,0.75);
      border: 1px dashed rgba(147,197,253,0.35);
      color: #cbd5e1;
      font-size: 14px;
      text-align: center;
    }

    .typing {
      color: #93c5fd;
      font-style: italic;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid rgba(59,130,246,0.3);
      background: rgba(15,23,42,0.95);
      color: white;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56,189,248,0.3);
    }

    button {
      padding: 15px 24px;
      border: none;
      border-radius: 14px;
      background:
        linear-gradient(
          135deg,
          #2563eb,
          #38bdf8
        );
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .footer {
      text-align: center;
      margin-top: 10px;
      color: #94a3b8;
      font-size: 14px;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: #2563eb;
      border-radius: 10px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 900px) {
      .sidebar {
        display: none;
      }

      .mobile-back-button {
        display: inline-block;
      }

      .message {
        max-width: 90%;
      }

      .chat-header {
        font-size: 28px;
      }
    }

    @media (max-width: 520px) {
      .chat-area {
        padding: 14px;
      }

      .input-area {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      .message {
        max-width: 96%;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="sidebar">
      <div class="logo">
        Kigazine <span>Ai</span>
      </div>

      <button
        type="button"
        class="back-button"
        onclick="goBack()"
      >
        ← Back
      </button>

      <button
        type="button"
        class="new-chat"
        onclick="newChat()"
      >
        + New Chat
      </button>

      <div class="mode-bar">
        <label for="mode">
          Choose Mode
        </label>

        <select id="mode">
          <option value="friendly">Friendly 😊</option>
          <option value="normal">Normal ⚡</option>
          <option value="work">Work 💼</option>
          <option value="coding">Coding 💻</option>
          <option value="school">School 📚</option>
          <option value="creative">Creative 🎨</option>
          <option value="kids">Kids 🧸</option>
        </select>
      </div>
    </div>

    <div class="chat-area">
      <div class="top-row">
        <button
          type="button"
          class="mobile-back-button"
          onclick="goBack()"
        >
          ← Back
        </button>

        <div class="chat-header">
          Kigazine Ai
        </div>
      </div>

      <div id="chat"></div>

      <div class="input-area">
        <input
          type="text"
          id="input"
          placeholder="Ask Kigazine Ai anything..."
          autocomplete="off"
        />

        <button
          type="button"
          id="send"
        >
          Send
        </button>
      </div>

      <div class="footer">
        Powered by OpenAI
      </div>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const mode = document.getElementById("mode");

    const STORAGE_KEYS = {
      sessionId: "kigazine.sessionId",
      mode: "kigazine.mode",
      historyPrefix: "kigazine.history."
    };

    const MAX_SAVED_MESSAGES = 100;

    let controller = null;
    let typingElement = null;

    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
        return;
      }

      if (document.referrer) {
        window.location.href = document.referrer;
        return;
      }

      window.location.href = "/";
    }

    function makeSessionId() {
      return `session-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    function getStoredSessionId() {
      const stored = localStorage.getItem(STORAGE_KEYS.sessionId);

      if (
        stored &&
        typeof stored === "string" &&
        stored.startsWith("session-")
      ) {
        return stored;
      }

      const next = makeSessionId();
      localStorage.setItem(STORAGE_KEYS.sessionId, next);
      return next;
    }

    let sessionId = getStoredSessionId();

    function historyKey() {
      return `${STORAGE_KEYS.historyPrefix}${sessionId}`;
    }

    function saveMode() {
      localStorage.setItem(STORAGE_KEYS.mode, mode.value);
    }

    function loadMode() {
      const savedMode = localStorage.getItem(STORAGE_KEYS.mode);

      if (!savedMode) return;

      const optionExists = Array
        .from(mode.options)
        .some(option => option.value === savedMode);

      if (optionExists) {
        mode.value = savedMode;
      }
    }

    function getHistory() {
      try {
        const raw = localStorage.getItem(historyKey());

        if (!raw) return [];

        const parsed = JSON.parse(raw);

        if (!Array.isArray(parsed)) return [];

        return parsed.filter(item =>
          item &&
          typeof item.text === "string" &&
          typeof item.type === "string"
        );
      } catch (error) {
        console.warn("Could not read chat history:", error);
        return [];
      }
    }

    function saveHistory(messages) {
      try {
        const trimmed = messages.slice(-MAX_SAVED_MESSAGES);
        localStorage.setItem(historyKey(), JSON.stringify(trimmed));
      } catch (error) {
        console.warn("Could not save chat history:", error);
      }
    }

    function rememberMessage(text, type) {
      const history = getHistory();

      history.push({
        text,
        type,
        createdAt: new Date().toISOString()
      });

      saveHistory(history);
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        chat.scrollTop = chat.scrollHeight;
      });
    }

    function addMessage(text, type, options = {}) {
      const { save = true } = options;

      const div = document.createElement("div");
      div.className = `message ${type}`;
      div.textContent = String(text || "");

      chat.appendChild(div);
      scrollToBottom();

      if (save && type !== "typing") {
        rememberMessage(div.textContent, type);
      }

      return div;
    }

    function renderHistory() {
      chat.innerHTML = "";

      const history = getHistory();

      if (history.length === 0) {
        addMessage(
          "Hi, I’m Kigazine Ai. Choose a mode and ask me anything.",
          "system",
          { save: false }
        );

        return;
      }

      for (const item of history) {
        addMessage(item.text, item.type, { save: false });
      }
    }

    function showTyping() {
      removeTyping();

      typingElement = document.createElement("div");
      typingElement.className = "message bot typing";
      typingElement.textContent = "Kigazine Ai is thinking...";

      chat.appendChild(typingElement);
      scrollToBottom();
    }

    function removeTyping() {
      if (typingElement) {
        typingElement.remove();
        typingElement = null;
      }
    }

    function setBusy(isBusy) {
      if (isBusy) {
        send.textContent = "Stop";
        input.disabled = true;
      } else {
        send.textContent = "Send";
        input.disabled = false;
        input.focus();
      }
    }

    async function readResponse(response) {
      const contentType = response.headers.get("content-type") || "";

      if (contentType.includes("application/json")) {
        return await response.json();
      }

      const text = await response.text();

      if (!response.ok) {
        throw new Error(
          text ||
          `Server error ${response.status}`
        );
      }

      return {
        reply: text
      };
    }

    async function newChat() {
      const oldSessionId = sessionId;

      try {
        await fetch("/api/reset", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            sessionId: oldSessionId
          })
        });
      } catch (error) {
        console.warn("Reset failed:", error);
      }

      localStorage.removeItem(
        `${STORAGE_KEYS.historyPrefix}${oldSessionId}`
      );

      sessionId = makeSessionId();

      localStorage.setItem(
        STORAGE_KEYS.sessionId,
        sessionId
      );

      chat.innerHTML = "";

      addMessage(
        "New chat started.",
        "system",
        { save: false }
      );

      input.value = "";
      input.disabled = false;
      send.textContent = "Send";
      input.focus();
    }

    function stopRequest() {
      if (controller) {
        controller.abort();
      }
    }

    async function sendMessage() {
      if (controller) {
        stopRequest();
        return;
      }

      const message = input.value.trim();

      if (!message) return;

      addMessage(message, "user");

      input.value = "";

      controller = new AbortController();

      setBusy(true);
      showTyping();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          signal: controller.signal,
          body: JSON.stringify({
            message,
            sessionId,
            mode: mode.value
          })
        });

        const data = await readResponse(response);

        if (!response.ok) {
          throw new Error(
            data.error ||
            data.message ||
            `Kigazine Ai backend error ${response.status}.`
          );
        }

        if (
          data.sessionId &&
          typeof data.sessionId === "string" &&
          data.sessionId !== sessionId
        ) {
          const oldHistory = getHistory();

          sessionId = data.sessionId;

          localStorage.setItem(
            STORAGE_KEYS.sessionId,
            sessionId
          );

          saveHistory(oldHistory);
        }

        const reply =
          typeof data.reply === "string" && data.reply.trim()
            ? data.reply
            : "Kigazine Ai did not send a reply.";

        addMessage(reply, "bot");

      } catch (error) {
        if (error.name === "AbortError") {
          addMessage("Request stopped.", "system", { save: false });
        } else {
          addMessage(
            error.message ||
            "Error communicating with Kigazine Ai.",
            "bot"
          );
        }
      } finally {
        removeTyping();
        controller = null;
        setBusy(false);
      }
    }

    send.addEventListener("click", sendMessage);

    input.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();

        if (!controller) {
          sendMessage();
        }
      }
    });

    mode.addEventListener("change", saveMode);

    loadMode();
    renderHistory();
    input.focus();
  </script>
</body>
</html>
