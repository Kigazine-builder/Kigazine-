</head>

<body>
  <div class="app">
    <div class="sidebar">
      <div class="logo">
        Kigazine <span>Ai</span>
      </div>

      <button
        type="button"
        class="back-button"
        onclick="goBack()"
      >
        ← Back
      </button>

      <button
        type="button"
        class="new-chat"
        onclick="newChat()"
      >
        + New Chat
      </button>

      <div class="mode-bar">
        <label for="mode">
          Choose Mode
        </label>

        <select id="mode">
          <option value="friendly">Friendly 😊</option>
          <option value="normal">Normal ⚡</option>
          <option value="work">Work 💼</option>
          <option value="coding">Coding 💻</option>
          <option value="school">School 📚</option>
          <option value="creative">Creative 🎨</option>
          <option value="kids">Kids 🧸</option>
        </select>
      </div>
    </div>

    <div class="chat-area">
      <div class="top-row">
        <button
          type="button"
          class="mobile-back-button"
          onclick="goBack()"
        >
          ← Back
        </button>

        <div class="chat-header">
          Kigazine Ai
        </div>
      </div>

      <div id="chat"></div>

      <div class="input-area">
        <input
          type="text"
          id="input"
          placeholder="Ask Kigazine Ai anything..."
          autocomplete="off"
        />

        <button
          type="button"
          id="send"
        >
          Send
        </button>
      </div>

      <div class="footer">
        Powered by OpenAI
      </div>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const mode = document.getElementById("mode");

    const STORAGE_KEYS = {
      sessionId: "kigazine.sessionId",
      mode: "kigazine.mode",
      historyPrefix: "kigazine.history."
    };

    const MAX_SAVED_MESSAGES = 100;

    let controller = null;
    let typingElement = null;

    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
        return;
      }

      if (document.referrer) {
        window.location.href = document.referrer;
        return;
      }

      window.location.href = "/";
    }

    function makeSessionId() {
      return `session-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    function getStoredSessionId() {
      const stored = localStorage.getItem(STORAGE_KEYS.sessionId);

      if (
        stored &&
        typeof stored === "string" &&
        stored.startsWith("session-")
      ) {
        return stored;
      }

      const next = makeSessionId();
      localStorage.setItem(STORAGE_KEYS.sessionId, next);
      return next;
    }

    let sessionId = getStoredSessionId();

    function historyKey() {
      return `${STORAGE_KEYS.historyPrefix}${sessionId}`;
    }

    function saveMode() {
      localStorage.setItem(STORAGE_KEYS.mode, mode.value);
    }

    function loadMode() {
      const savedMode = localStorage.getItem(STORAGE_KEYS.mode);

      if (!savedMode) return;

      const optionExists = Array
        .from(mode.options)
        .some(option => option.value === savedMode);

      if (optionExists) {
        mode.value = savedMode;
      }
    }

    function getHistory() {
      try {
        const raw = localStorage.getItem(historyKey());

        if (!raw) return [];

        const parsed = JSON.parse(raw);

        if (!Array.isArray(parsed)) return [];

        return parsed.filter(item =>
          item &&
          typeof item.text === "string" &&
          typeof item.type === "string"
        );
      } catch (error) {
        console.warn("Could not read chat history:", error);
        return [];
      }
    }

    function saveHistory(messages) {
      try {
        const trimmed = messages.slice(-MAX_SAVED_MESSAGES);
        localStorage.setItem(historyKey(), JSON.stringify(trimmed));
      } catch (error) {
        console.warn("Could not save chat history:", error);
      }
    }

    function rememberMessage(text, type) {
      const history = getHistory();

      history.push({
        text,
        type,
        createdAt: new Date().toISOString()
      });

      saveHistory(history);
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        chat.scrollTop = chat.scrollHeight;
      });
    }

    function addMessage(text, type, options = {}) {
      const { save = true } = options;

      const div = document.createElement("div");
      div.className = `message ${type}`;
      div.textContent = String(text || "");

      chat.appendChild(div);
      scrollToBottom();

      if (save && type !== "typing") {
        rememberMessage(div.textContent, type);
      }

      return div;
    }

    function renderHistory() {
      chat.innerHTML = "";

      const history = getHistory();

      if (history.length === 0) {
        addMessage(
          "Hi, I’m Kigazine Ai. Choose a mode and ask me anything.",
          "system",
          { save: false }
        );

        return;
      }

      for (const item of history) {
        addMessage(item.text, item.type, { save: false });
      }
    }

    function showTyping() {
      removeTyping();

      typingElement = document.createElement("div");
      typingElement.className = "message bot typing";
      typingElement.textContent = "Kigazine Ai is thinking...";

      chat.appendChild(typingElement);
      scrollToBottom();
    }

    function removeTyping() {
      if (typingElement) {
        typingElement.remove();
        typingElement = null;
      }
    }

    function setBusy(isBusy) {
      if (isBusy) {
        send.textContent = "Stop";
        input.disabled = true;
      } else {
        send.textContent = "Send";
        input.disabled = false;
        input.focus();
      }
    }

    async function readResponse(response) {
      const contentType = response.headers.get("content-type") || "";

      if (contentType.includes("application/json")) {
        return await response.json();
      }

      const text = await response.text();

      if (!response.ok) {
        throw new Error(
          text ||
          `Server error ${response.status}`
        );
      }

      return {
        reply: text
      };
    }

    async function newChat() {
      const oldSessionId = sessionId;

      try {
        await fetch("/api/reset", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            sessionId: oldSessionId
          })
        });
      } catch (error) {
        console.warn("Reset failed:", error);
      }

      localStorage.removeItem(
        `${STORAGE_KEYS.historyPrefix}${oldSessionId}`
      );

      sessionId = makeSessionId();

      localStorage.setItem(
        STORAGE_KEYS.sessionId,
        sessionId
      );

      chat.innerHTML = "";

      addMessage(
        "New chat started.",
        "system",
        { save: false }
      );

      input.value = "";
      input.disabled = false;
      send.textContent = "Send";
      input.focus();
    }

    function stopRequest() {
      if (controller) {
        controller.abort();
      }
    }

    async function sendMessage() {
      if (controller) {
        stopRequest();
        return;
      }

      const message = input.value.trim();

      if (!message) return;

      addMessage(message, "user");

      input.value = "";

      controller = new AbortController();

      setBusy(true);
      showTyping();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          signal: controller.signal,
          body: JSON.stringify({
            message,
            sessionId,
            mode: mode.value
          })
        });

        const data = await readResponse(response);

        if (!response.ok) {
          throw new Error(
            data.error ||
            data.message ||
            `Kigazine Ai backend error ${response.status}.`
          );
        }

        if (
          data.sessionId &&
          typeof data.sessionId === "string" &&
          data.sessionId !== sessionId
        ) {
          const oldHistory = getHistory();

          sessionId = data.sessionId;

          localStorage.setItem(
            STORAGE_KEYS.sessionId,
            sessionId
          );

          saveHistory(oldHistory);
        }

        const reply =
          typeof data.reply === "string" && data.reply.trim()
            ? data.reply
            : "Kigazine Ai did not send a reply.";

        addMessage(reply, "bot");

      } catch (error) {
        if (error.name === "AbortError") {
          addMessage("Request stopped.", "system", { save: false });
        } else {
          addMessage(
            error.message ||
            "Error communicating with Kigazine Ai.",
            "bot"
          );
        }
      } finally {
        removeTyping();
        controller = null;
        setBusy(false);
      }
    }

    send.addEventListener("click", sendMessage);

    input.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();

        if (!controller) {
          sendMessage();
        }
      }
    });

    mode.addEventListener("change", saveMode);

    loadMode();
    renderHistory();
    input.focus();
  </script>
</body>
</html>
