<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kigazine Fitness Tracker</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
        }

        .press-feedback:active {
            transform: scale(0.98);
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .action-disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none !important;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 text-slate-900">

    <main class="bg-white rounded-2xl shadow-lg max-w-md w-full overflow-hidden border border-slate-200">
        <header class="bg-slate-950 px-6 py-5 text-white">
            <button
                id="backBtn"
                type="button"
                class="mb-4 inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-sm font-semibold transition"
                aria-label="Go back to previous page"
            >
                ← Back
            </button>

            <h1 class="text-2xl font-extrabold tracking-tight">
                Kigazine Fitness Tracker
            </h1>
            <p class="text-slate-300 text-sm font-medium mt-1">
                Repetition tracker for conditioning drills
            </p>
        </header>

        <section class="p-6">
            <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3 px-1">
                Activity
            </h2>

            <div
                class="flex overflow-x-auto gap-3 pb-2 hide-scrollbar px-1"
                id="exercise-buttons"
                aria-label="Exercise selection"
            ></div>

            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 mt-4 flex items-center gap-4">
                <canvas
                    id="coachCanvas"
                    class="bg-white rounded-lg shadow-sm shrink-0 border border-slate-200 w-20 h-20"
                    aria-hidden="true"
                ></canvas>

                <div>
                    <h3 class="font-bold text-slate-900 text-sm">
                        Form cue
                    </h3>
                    <p id="demo-text" class="text-slate-600 text-sm font-medium mt-1">
                        Maintain controlled movement and steady breathing.
                    </p>
                </div>
            </div>

            <div class="relative w-full flex justify-center my-6">
                <canvas
                    id="workoutCanvas"
                    class="w-full max-w-[300px] h-auto drop-shadow-sm rounded-xl transition-transform duration-150"
                    role="img"
                    aria-label="Workout progress"
                ></canvas>
            </div>

            <p id="progress-status" class="sr-only" aria-live="polite">
                0 of 10 repetitions completed.
            </p>

            <div class="flex flex-col gap-3">
                <button
                    id="repBtn"
                    type="button"
                    class="press-feedback w-full bg-slate-950 hover:bg-slate-800 text-white font-bold text-lg py-4 rounded-xl shadow-sm transition-all"
                >
                    Add repetition
                </button>

                <button
                    id="resetBtn"
                    type="button"
                    class="press-feedback w-full bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 font-bold text-base py-3 rounded-xl transition-all"
                >
                    Reset session
                </button>
            </div>
        </section>

        <footer class="bg-slate-50 px-4 py-3 text-center text-xs font-medium text-slate-500 border-t border-slate-200">
            Stop immediately if you feel pain, dizziness, or unusual shortness of breath.
        </footer>
    </main>

    <script>
        const exercises = [
            {
                name: "Jumping Jacks",
                code: "JACKS",
                color: "#4f46e5",
                tip: "Land softly, keep your rhythm steady, and control the arm movement."
            },
            {
                name: "Bodyweight Squats",
                code: "SQUAT",
                color: "#d97706",
                tip: "Keep your chest up, spine neutral, and knees tracking over your toes."
            },
            {
                name: "Frog Hops",
                code: "HOPS",
                color: "#059669",
                tip: "Start low, drive through your legs, and land under control."
            },
            {
                name: "Arm Circles",
                code: "ARMS",
                color: "#be185d",
                tip: "Keep your arms extended and make controlled, consistent circles."
            }
        ];

        const targetReps = 10;
        const mainCanvasSize = 300;
        const coachCanvasSize = 80;

        let currentExerciseIndex = 0;
        let repCount = 0;
        let targetProgress = 0;
        let currentProgress = 0;
        let pulseRadius = 0;
        let pulseOpacity = 1;

        const backBtn = document.getElementById("backBtn");
        const exerciseContainer = document.getElementById("exercise-buttons");
        const demoText = document.getElementById("demo-text");
        const repBtn = document.getElementById("repBtn");
        const resetBtn = document.getElementById("resetBtn");
        const progressStatus = document.getElementById("progress-status");

        const mainCanvas = document.getElementById("workoutCanvas");
        const mainCtx = mainCanvas.getContext("2d");

        const coachCanvas = document.getElementById("coachCanvas");
        const coachCtx = coachCanvas.getContext("2d");

        const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

        backBtn.addEventListener("click", () => {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "index.html";
            }
        });

        function configureCanvas(canvas, ctx, cssWidth, cssHeight) {
            const dpr = Math.max(window.devicePixelRatio || 1, 1);

            canvas.width = Math.round(cssWidth * dpr);
            canvas.height = Math.round(cssHeight * dpr);

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function setupCanvases() {
            configureCanvas(mainCanvas, mainCtx, mainCanvasSize, mainCanvasSize);
            configureCanvas(coachCanvas, coachCtx, coachCanvasSize, coachCanvasSize);
        }

        function renderExerciseButtons() {
            exerciseContainer.textContent = "";

            exercises.forEach((exercise, index) => {
                const isSelected = index === currentExerciseIndex;

                const button = document.createElement("button");
                button.type = "button";
                button.textContent = exercise.name;
                button.setAttribute("aria-pressed", String(isSelected));

                button.className = [
                    "flex-shrink-0",
                    "px-4",
                    "py-2.5",
                    "rounded-lg",
                    "font-semibold",
                    "text-sm",
                    "transition-all",
                    "duration-200",
                    "border",
                    "focus:outline-none",
                    "focus:ring-2",
                    "focus:ring-offset-2"
                ].join(" ");

                if (isSelected) {
                    button.style.backgroundColor = `${exercise.color}14`;
                    button.style.borderColor = exercise.color;
                    button.style.color = exercise.color;
                    button.style.boxShadow = `inset 0 0 0 1px ${exercise.color}`;
                } else {
                    button.classList.add(
                        "bg-white",
                        "border-slate-200",
                        "text-slate-600",
                        "hover:border-slate-300",
                        "hover:bg-slate-50"
                    );
                }

                button.addEventListener("click", () => setExercise(index));
                exerciseContainer.appendChild(button);
            });
        }

        function resetProgressState() {
            repCount = 0;
            targetProgress = 0;
            currentProgress = 0;
            pulseRadius = 0;
            pulseOpacity = 1;
        }

        function setExercise(index) {
            if (!Number.isInteger(index) || index < 0 || index >= exercises.length) {
                return;
            }

            currentExerciseIndex = index;
            resetProgressState();
            renderExerciseButtons();
            updateExerciseCue();
            updateControls();
        }

        function updateExerciseCue() {
            demoText.textContent = exercises[currentExerciseIndex].tip;
        }

        function addRep() {
            if (repCount >= targetReps) {
                return;
            }

            repCount += 1;

            if (!prefersReducedMotion.matches) {
                mainCanvas.style.transform = "scale(1.03)";
                window.setTimeout(() => {
                    mainCanvas.style.transform = "scale(1)";
                }, 120);
            }

            updateControls();
        }

        function resetTracker() {
            resetProgressState();
            updateControls();
        }

        function updateControls() {
            const currentExercise = exercises[currentExerciseIndex];
            const isComplete = repCount >= targetReps;

            repBtn.disabled = isComplete;
            repBtn.textContent = isComplete ? "Target complete" : "Add repetition";
            repBtn.classList.toggle("action-disabled", isComplete);

            const statusText = `${repCount} of ${targetReps} repetitions completed for ${currentExercise.name}.`;

            progressStatus.textContent = statusText;
            mainCanvas.setAttribute("aria-label", statusText);
        }

        function updateLogic() {
            targetProgress = Math.min(repCount / targetReps, 1);

            if (prefersReducedMotion.matches) {
                currentProgress = targetProgress;
            } else {
                currentProgress += (targetProgress - currentProgress) * 0.15;
            }

            if (repCount >= targetReps && !prefersReducedMotion.matches) {
                pulseRadius += 0.8;
                pulseOpacity -= 0.02;

                if (pulseOpacity <= 0) {
                    pulseRadius = 0;
                    pulseOpacity = 1;
                }
            } else {
                pulseRadius = 0;
                pulseOpacity = 1;
            }
        }

        function drawCoach(timestamp) {
            const ctx = coachCtx;
            const time = prefersReducedMotion.matches ? 0 : timestamp;
            const exerciseColor = exercises[currentExerciseIndex].color;

            ctx.clearRect(0, 0, coachCanvasSize, coachCanvasSize);

            ctx.strokeStyle = exerciseColor;
            ctx.fillStyle = exerciseColor;
            ctx.lineWidth = 4;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            let headY = 20;
            let shoulderY = 30;
            let hipY = 50;

            let leftFootX = 30;
            let rightFootX = 50;
            let footY = 70;

            let leftHandX = 20;
            let rightHandX = 60;
            let handY = 45;

            let leftKneeX = leftFootX;
            let rightKneeX = rightFootX;
            let kneeY = 60;

            let useKnees = false;

            const cycle = Math.sin(time * 0.006);
            const progress = (cycle + 1) / 2;

            if (currentExerciseIndex === 0) {
                leftFootX = 40 - (8 + progress * 16);
                rightFootX = 40 + (8 + progress * 16);

                leftHandX = 40 - (12 + progress * 18);
                rightHandX = 40 + (12 + progress * 18);
                handY = 55 - progress * 45;

                headY -= progress * 4;
                shoulderY -= progress * 4;
                hipY -= progress * 4;
            }

            if (currentExerciseIndex === 1) {
                useKnees = true;

                const squatDepth = progress * 14;

                headY += squatDepth;
                shoulderY += squatDepth;
                hipY += squatDepth;

                leftKneeX = 25;
                rightKneeX = 55;
                kneeY = 50 + squatDepth;

                leftHandX = 25;
                rightHandX = 55;
                handY = shoulderY + 5;
            }

            if (currentExerciseIndex === 2) {
                useKnees = true;

                const jump = Math.max(0, Math.sin(time * 0.008));
                const crouch = Math.max(0, -Math.sin(time * 0.008));

                if (jump > 0) {
                    headY -= jump * 12;
                    shoulderY -= jump * 12;
                    hipY -= jump * 12;
                    footY -= jump * 12;

                    leftHandX = 25;
                    rightHandX = 55;
                    handY = shoulderY - 5;

                    leftKneeX = 35;
                    rightKneeX = 45;
                    kneeY = hipY + 10;

                    leftFootX = 35;
                    rightFootX = 45;
                } else {
                    headY += crouch * 16;
                    shoulderY += crouch * 16;
                    hipY += crouch * 16;

                    leftHandX = 30;
                    rightHandX = 50;
                    handY = footY;

                    leftKneeX = 20;
                    rightKneeX = 60;
                    kneeY = 65;
                }
            }

            if (currentExerciseIndex === 3) {
                const angle = time * 0.008;
                const radius = 12;

                leftHandX = 25 + Math.cos(angle) * radius;
                rightHandX = 55 + Math.cos(-angle) * radius;
                handY = shoulderY + Math.sin(angle) * radius;
            }

            ctx.beginPath();
            ctx.arc(40, headY, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();

            ctx.moveTo(40, headY + 6);
            ctx.lineTo(40, hipY);

            ctx.moveTo(40, shoulderY);
            ctx.lineTo(leftHandX, handY);

            ctx.moveTo(40, shoulderY);
            ctx.lineTo(rightHandX, handY);

            if (useKnees) {
                ctx.moveTo(40, hipY);
                ctx.lineTo(leftKneeX, kneeY);
                ctx.lineTo(leftFootX, footY);

                ctx.moveTo(40, hipY);
                ctx.lineTo(rightKneeX, kneeY);
                ctx.lineTo(rightFootX, footY);
            } else {
                ctx.moveTo(40, hipY);
                ctx.lineTo(leftFootX, footY);

                ctx.moveTo(40, hipY);
                ctx.lineTo(rightFootX, footY);
            }

            ctx.stroke();
        }

        function drawCanvas() {
            const currentExercise = exercises[currentExerciseIndex];
            const centerX = mainCanvasSize / 2;
            const centerY = mainCanvasSize / 2;
            const radius = 100;
            const ctx = mainCtx;

            ctx.clearRect(0, 0, mainCanvasSize, mainCanvasSize);

            if (repCount >= targetReps && !prefersReducedMotion.matches) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius + 15 + pulseRadius, 0, 2 * Math.PI);
                ctx.lineWidth = 4;
                ctx.strokeStyle = `rgba(5, 150, 105, ${pulseOpacity})`;
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.lineWidth = 18;
            ctx.strokeStyle = "#e2e8f0";
            ctx.lineCap = "round";
            ctx.stroke();

            if (currentProgress > 0) {
                const startAngle = -0.5 * Math.PI;
                const endAngle = startAngle + currentProgress * 2 * Math.PI;

                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.lineWidth = 18;
                ctx.lineCap = "round";
                ctx.strokeStyle = repCount >= targetReps ? "#059669" : currentExercise.color;
                ctx.stroke();
            }

            ctx.font = "700 15px Inter, sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = currentExercise.color;
            ctx.fillText(currentExercise.code, centerX, centerY - 44);

            ctx.font = "800 58px Inter, sans-serif";
            ctx.fillStyle = "#0f172a";
            ctx.fillText(String(repCount), centerX, centerY + 10);

            ctx.font = "700 15px Inter, sans-serif";
            ctx.fillStyle = "#64748b";
            ctx.fillText(`/ ${targetReps} reps`, centerX, centerY + 48);

            if (repCount >= targetReps) {
                ctx.fillStyle = "#059669";
                roundRect(ctx, centerX - 72, mainCanvasSize - 35, 144, 30, 8);

                ctx.font = "700 13px Inter, sans-serif";
                ctx.fillStyle = "#ffffff";
                ctx.fillText("Target complete", centerX, mainCanvasSize - 20);
            }
        }

        function roundRect(ctx, x, y, width, height, radius) {
            const safeRadius = Math.min(radius, width / 2, height / 2);

            ctx.beginPath();
            ctx.moveTo(x + safeRadius, y);
            ctx.lineTo(x + width - safeRadius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + safeRadius);
            ctx.lineTo(x + width, y + height - safeRadius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - safeRadius, y + height);
            ctx.lineTo(x + safeRadius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - safeRadius);
            ctx.lineTo(x, y + safeRadius);
            ctx.quadraticCurveTo(x, y, x + safeRadius, y);
            ctx.closePath();
            ctx.fill();
        }

        function drawLoop(timestamp = 0) {
            updateLogic();
            drawCanvas();
            drawCoach(timestamp);
            window.requestAnimationFrame(drawLoop);
        }

        repBtn.addEventListener("click", addRep);
        resetBtn.addEventListener("click", resetTracker);

        window.addEventListener("resize", setupCanvases);

        setupCanvases();
        setExercise(0);
        window.requestAnimationFrame(drawLoop);
    </script>
</body>
</html>
